name: Validate predictive consumption intelligence

on:
  push:
    branches:
      - feature/predictive-consumption-intelligence

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Full test suite
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href "/tacopos/" --no-wasm-dry-run
