name: Validate rapid card sales audit

on:
  push:
    branches:
      - feature/rapid-card-sales-audit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Focused test
        run: flutter test test/rapid_card_sales_audit_test.dart

      - name: Build web
        run: flutter build web --release --base-href "/tacopos/" --no-wasm-dry-run
