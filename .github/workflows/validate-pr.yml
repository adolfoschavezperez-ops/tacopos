name: Validate TacoPOS PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter 3.38.4
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.4'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href "/tacopos/" --no-wasm-dry-run

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies and emulator CLI
        run: npm install --no-save --no-audit --no-fund firebase-tools@14
      - name: Firestore rules in an isolated demo emulator
        run: npx firebase emulators:exec --project demo-tacopos-pr --only firestore "npm run test:rules"
