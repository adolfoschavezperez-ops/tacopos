name: Backend CI

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - 'feature/cash-audit-backend'
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
